server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # The save pipeline muxes media in the browser with libav.wasm, which needs
    # SharedArrayBuffer and therefore a cross-origin-isolated document. Without
    # these two headers every download of type merge/remux/mute/audio/gif fails.
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    error_page 404 /404.html;

    # nginx's mime.types covers .js but not .mjs, and the browser's module loader
    # refuses a module served as application/octet-stream.
    location ~ \.mjs$ {
        types { }
        default_type application/javascript;
    }

    # Pages are prerendered as flat files: /about/terms -> about/terms.html
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
