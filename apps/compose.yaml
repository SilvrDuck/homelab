---

services:
  filebrowser:
    image: filebrowser/filebrowser:s6
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${DOCKER_PGID}
    volumes:
      - ${FOLDER_FOR_MEDIA}:/srv
      - ./filebrowser/database:/database
      - ./filebrowser/config:/config
    networks:
      - web
    labels:
      - "homepage.group=Apps"
      - "homepage.name=File Browser"
      - "homepage.icon=mdi-file-cabinet"
      - "homepage.href=https://filebrowser.thvi.ch"
      - "homepage.description=Web-based file manager"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.filebrowser.rule=Host(`filebrowser.thvi.ch`)"
      - "traefik.http.routers.filebrowser.entrypoints=websecure"
      - "traefik.http.routers.filebrowser.tls.certresolver=myresolver"
      - "traefik.http.services.filebrowser.loadbalancer.server.port=80"

  potluck:
    build: ./potluck
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${DOCKER_PGID}
      - GEMINI_API_KEY=${POTLUCK_GEMINI_API_KEY}
    volumes:
      - ./potluck/data:/app/data
    networks:
      - web
    labels:
      - "homepage.group=Apps"
      - "homepage.name=Roulette du Pastis"
      - "homepage.icon=mdi-glass-cocktail"
      - "homepage.href=https://pastis-roulette.thvi.ch"
      - "homepage.description=Potluck matcher with AI"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.potluck.rule=Host(`pastis-roulette.thvi.ch`)"
      - "traefik.http.routers.potluck.entrypoints=websecure"
      - "traefik.http.routers.potluck.tls.certresolver=myresolver"
      - "traefik.http.services.potluck.loadbalancer.server.port=8080"

  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    container_name: obsidian
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
      - PIXELFLUX_WAYLAND=true
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/obsidian:/config
      - ${FOLDER_FOR_MEDIA:?err}/obsidian/vaults:/config/vaults
    shm_size: "1gb"
    networks:
      - web
    labels:
      - "homepage.group=Apps"
      - "homepage.name=Obsidian"
      - "homepage.icon=mdi-notebook"
      - "homepage.href=https://${PUBLIC_URL_OBSIDIAN}"
      - "homepage.description=Notes (browser-streamed desktop app)"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.obsidian.rule=Host(`${PUBLIC_URL_OBSIDIAN}`)"
      - "traefik.http.routers.obsidian.entrypoints=websecure"
      - "traefik.http.routers.obsidian.tls.certresolver=myresolver"
      - "traefik.http.routers.obsidian.middlewares=authentik@file"
      - "traefik.http.routers.obsidian-outpost.rule=Host(`${PUBLIC_URL_OBSIDIAN}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      - "traefik.http.routers.obsidian-outpost.entrypoints=websecure"
      - "traefik.http.routers.obsidian-outpost.tls.certresolver=myresolver"
      - "traefik.http.routers.obsidian-outpost.service=authentik@docker"
      - "traefik.http.services.obsidian.loadbalancer.server.port=3001"
      - "traefik.http.services.obsidian.loadbalancer.server.scheme=https"
      - "traefik.http.services.obsidian.loadbalancer.serversTransport=obsidian-insecure@file"

  syncthing:
    image: lscr.io/linuxserver/syncthing:latest
    container_name: syncthing
    hostname: homelab-syncthing
    restart: unless-stopped
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TIMEZONE}
    volumes:
      - ${FOLDER_FOR_CONFIGS:?err}/syncthing:/config
      - ${FOLDER_FOR_MEDIA:?err}/obsidian/vaults:/sync/obsidian-vault
    ports:
      - "22000:22000/tcp"
      - "22000:22000/udp"
      - "21027:21027/udp"
      - "8384:8384"
    networks:
      - web
    labels:
      - "homepage.group=Apps"
      - "homepage.name=Syncthing"
      - "homepage.icon=mdi-folder-sync"
      - "homepage.href=http://syncthing.lan"
      - "homepage.description=File sync hub"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.syncthing-lan.rule=Host(`syncthing.lan`)"
      - "traefik.http.routers.syncthing-lan.entrypoints=web"
      - "traefik.http.services.syncthing-lan.loadbalancer.server.port=8384"

networks:
  web:
    external: true
