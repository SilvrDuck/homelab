music_directory     "/var/lib/mpd/music"
playlist_directory  "/var/lib/mpd/playlists"
db_file             "/var/lib/mpd/tag_cache"
state_file          "/var/lib/mpd/state"
sticker_file        "/var/lib/mpd/sticker.sql"
user                "mpd"
bind_to_address     "localhost"
auto_update         "no"

# Persist queue and play state every 10 s so a power cut loses at most 10 s of changes.
state_file_interval "10"
restore_paused      "no"

audio_output {
    type        "alsa"
    name        "XO-BCC16"
    device      "bluealsa:DEV=@XO_MAC@,PROFILE=a2dp"
    mixer_type  "software"
}
