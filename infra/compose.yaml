services:
  samba:
    image: dperson/samba
    restart: unless-stopped
    volumes:
      - ${FOLDER_FOR_MEDIA}:/mount
    environment:
      - USERID=1000
      - GROUPID=1000
      # USER and PASSWORD set on the host there https://blog.kye.dev/proxmox-zfs-mounts
      - USER=${SMB_USER};${SMB_PASSWORD}
    ports:
      - "139:139"
      - "445:445"
    command: [ "-s", "media;/mount;yes;no;no;all;none", "-p" ]
    labels:
      - "homepage.group=Media"
      - "homepage.name=Samba"
      - "homepage.icon=mdi-folder"
      - "homepage.href=smb://${HOMELAB_IP}/media"
      - "homepage.description=Samba file share"

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    environment:
      PUID: ${PUID}
      PGID: ${DOCKER_PGID}
      HOMEPAGE_ALLOWED_HOSTS: "*"
    ports:
      - ${HOMEPAGE_PORT}:3000
    volumes:
      - ./homepage/config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
      - /mnt/media:/mnt/media:ro # optional, for ressource widget
    networks:
      - web
      - default
    restart: unless-stopped
    labels:
      - "homepage.group=Infra"
      - "homepage.name=Homepage"
      - "homepage.icon=mdi-home"
      - "homepage.href=http://homepage.lan"
      - "homepage.description=Main homelab dashboard"
      - "traefik.docker.network=web"
      - "traefik.http.routers.homepage-lan.rule=Host(`homepage.lan`)"
      - "traefik.http.routers.homepage-lan.entrypoints=web"
      - "traefik.http.services.homepage-lan.loadbalancer.server.port=3000"

  upsnap:
    image: ghcr.io/seriousm4x/upsnap:latest
    container_name: upsnap
    restart: unless-stopped
    environment:
      TZ: "Europe/Zurich"
      PUID: ${PUID}
      PGID: ${DOCKER_PGID}
    volumes:
      - ./upsnap/data:/app/pb_data
    ports:
      - "${UPSNAP_PORT:-8090}:8090"
    entrypoint: /bin/sh -c "apk update && apk add --no-cache nmap && rm -rf /var/cache/apk/* && ./upsnap serve --http 0.0.0.0:8090"
    healthcheck:
      test: curl -fs "http://localhost:8090/api/health" || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "homepage.group=Infra"
      - "homepage.name=UpSnap"
      - "homepage.icon=mdi-network"
      - "homepage.href=http://${HOMELAB_IP}:${UPSNAP_PORT:-8090}"
      - "homepage.description=Wake on line any device"

  mongo-express:
    image: mongo-express:latest
    restart: unless-stopped
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_SERVER: dnd-ibot-db
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_BASICAUTH_USERNAME: ${SMB_USER}
      ME_CONFIG_BASICAUTH_PASSWORD: ${SMB_PASSWORD}
    networks:
      - web
      - default
    labels:
      - "homepage.group=Infra"
      - "homepage.name=Mongo Express"
      - "homepage.icon=mongodb.png"
      - "homepage.href=http://${HOMELAB_IP}:${MONGO_EXPRESS_PORT:-8081}"
      - "homepage.description=MongoDB admin interface"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.mongo-express-lan.rule=Host(`mongo.lan`)"
      - "traefik.http.routers.mongo-express-lan.entrypoints=web"
      - "traefik.http.services.mongo-express-lan.loadbalancer.server.port=8081"

  authentik-postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ./authentik/database:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${AUTHENTIK_PG_PASS}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    networks:
      - authentik-internal

  authentik-redis:
    image: docker.io/library/redis:alpine
    container_name: authentik-redis
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ./authentik/redis:/data
    networks:
      - authentik-internal

  authentik-server:
    image: ghcr.io/goauthentik/server:2026.2
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    volumes:
      - ./authentik/media:/media
      - ./authentik/custom-templates:/templates
      - ./authentik/blueprints:/blueprints/local:ro
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - web
      - authentik-internal
    labels:
      - "homepage.group=Infra"
      - "homepage.name=Authentik"
      - "homepage.icon=mdi-shield-key"
      - "homepage.href=https://${PUBLIC_URL_AUTHENTIK}"
      - "homepage.description=Identity provider / SSO"
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.authentik.rule=Host(`${PUBLIC_URL_AUTHENTIK}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls.certresolver=myresolver"
      - "traefik.http.services.authentik.loadbalancer.server.port=9000"

  authentik-worker:
    image: ghcr.io/goauthentik/server:2026.2
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_PG_PASS}
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
    user: root
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./authentik/media:/media
      - ./authentik/custom-templates:/templates
      - ./authentik/blueprints:/blueprints/local:ro
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - authentik-internal

networks:
  web:
    external: true
  authentik-internal:
    driver: bridge
