# qbit_manage: removes a movie/show torrent and its download once its library
# copy is gone (deleted in Jellyseerr/Radarr/Sonarr, or replaced by an
# upgrade). Only the movies and shows categories are touched; everything else
# in qBittorrent (seeding limits, other categories) is left alone.
# qbit_manage writes missing defaults back into this file, so every key it
# expects is listed explicitly.
# Docs: https://github.com/StuffAnThings/qbit_manage/wiki/Config-Setup

qbt:
  host: qbittorrent:8200
  user: !ENV QBIT_USER
  pass: !ENV QBIT_PASS

settings:
  force_auto_tmm: false
  force_auto_tmm_ignore_tags: []
  tracker_error_tag: issue
  nohardlinks_tag: noHL
  stalled_tag: stalledDL
  private_tag:
  share_limits_tag: ~share_limit
  share_limits_min_seeding_time_tag: MinSeedTimeNotReached
  share_limits_min_num_seeds_tag: MinSeedsNotMet
  share_limits_last_active_tag: LastActiveLimitNotReached
  cat_filter_completed: true
  share_limits_filter_completed: true
  tag_nohardlinks_filter_completed: true
  rem_unregistered_filter_completed: false
  rem_unregistered_ignore_list: []
  rem_unregistered_grace_minutes: 10
  rem_unregistered_max_torrents: 10
  cat_update_all: false
  # Keep qBittorrent's own global seeding limits untouched.
  disable_qbt_default_share_limits: false
  tag_stalled_torrents: false

directory:
  root_dir: /data/downloads/torrents/
  remote_dir: /data/downloads/torrents/
  torrents_dir:

# Mandatory mapping of every qBittorrent category to its save path.
cat:
  movies: /data/downloads/torrents/movies
  shows: /data/downloads/torrents/shows
  anonamouse: /data/downloads/torrents/anonamouse
  audiobook: /data/downloads/torrents/audiobook
  desktop: /data/downloads/torrents/desktop
  prowlarr: /data/downloads/torrents/prowlarr

nohardlinks:
  movies:
    ignore_root_dir: true
  shows:
    ignore_root_dir: true

share_limits:
  library-deleted:
    priority: 1
    include_all_tags:
    - noHL
    categories:
    - movies
    - shows
    # A ratio of 0 is always reached, so matching torrents are removed on the
    # same run they are tagged.
    max_ratio: 0
    max_seeding_time: -1
    cleanup: true
    add_group_to_tag: false

recyclebin:
  enabled: false
  empty_after_x_days:
  save_torrents: false
  split_by_category: false

orphaned:
  empty_after_x_days:
  exclude_patterns:
  max_orphaned_files_to_delete: 50
  min_file_age_minutes: 0

webhooks:
  error:
  run_start:
  run_end:
  function:
    recheck:
    cat_update:
    tag_update:
    rem_unregistered:
    tag_tracker_error:
    rem_orphaned:
    tag_nohardlinks:
    share_limits:
    cleanup_dirs:

# Catch-all so qbit_manage does not write every tracker it sees into this file.
tracker:
  other:
    tag: other
